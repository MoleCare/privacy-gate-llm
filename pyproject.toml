[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "privacy-gate-llm"
version = "1.0.1"
description = "A very small model that catches health data, credentials and personal data written as ordinary English, which pattern rules cannot see. bge-m3 plus 1024 weights. A second gate that may only ever add a hold."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Yauhen Bichel" }]
keywords = [
  "privacy", "pii", "phi", "pii-detection", "phi-detection", "guardrails", "llm-safety", "llm-router",
  "prompt-guard", "data-loss-prevention", "gdpr", "healthcare", "embeddings", "bge-m3", "ollama",
  "sentence-transformers", "text-classification", "prompt-privacy", "llm-guardrail", "local-llm-router",
  "secret-detection", "privacy-filter", "openai", "claude",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Environment :: Console",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
# The core is standard library only, on purpose: it runs anywhere Python does. The embedding comes from
# an Ollama or OpenAI-compatible endpoint you already run. `local` adds an in-process encoder.
dependencies = []

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]

[project.scripts]
privacy-gate = "privacy_gate.cli:main"

[project.urls]
Homepage = "https://yauhenbichel.github.io/privacy-gate-llm/"
Demo = "https://huggingface.co/spaces/YauhenBichel/privacy-gate-llm-demo"
Documentation = "https://github.com/YauhenBichel/privacy-gate-llm/blob/main/docs/INTEGRATION.md"
Source = "https://github.com/YauhenBichel/privacy-gate-llm"
Issues = "https://github.com/YauhenBichel/privacy-gate-llm/issues"
Changelog = "https://github.com/YauhenBichel/privacy-gate-llm/blob/main/CHANGELOG.md"
Model = "https://huggingface.co/YauhenBichel/privacy-gate-llm"
Dataset = "https://huggingface.co/datasets/YauhenBichel/privacy-gate-gold"

# Only the runtime ships. Training, calibration and evaluation (`training/`) and the rules compiler
# (`scripts/`) live outside `src/` and are in neither distribution; a maintainer runs them from a checkout.
[tool.hatch.build.targets.wheel]
packages = ["src/privacy_gate"]

# The head ships inside the wheel, so `Gate.load()` works with no path and no checkout. The canonical file
# stays at model/head-v1.json, where the journal, the data job and the model card point.
[tool.hatch.build.targets.wheel.force-include]
"model/head-v1.json" = "privacy_gate/models/head-v1.json"

# Patterns are gitignore-style: a bare "README.md" matches every README.md at any depth, so root files are
# anchored with a leading "/". Otherwise training/README.md (and the integrations/ and space READMEs) ride along.
[tool.hatch.build.targets.sdist]
include = [
  "/src/privacy_gate", "/model/head-v1.json", "/rules/privacy-v2.yaml", "/rules/conformance.v2.json",
  "/rules/conformance.bodies.v2.json", "/README.md", "/LICENSE", "/NOTICE", "/CHANGELOG.md", "/pyproject.toml",
]

# Development tools only. Nothing here is a runtime dependency: `dependencies = []` above stays empty, and
# the `package` CI job fails if the installed wheel pulls anything in. Exact pins, so a new lint rule or a
# stricter mypy release is a deliberate bump, not a surprise red build. Install with `uv sync --group dev`
# or `pip install --group dev` (pip 25.1+).
[dependency-groups]
dev = [
  "ruff==0.17.6",
  "mypy==2.4.1",
  "coverage==7.17.3",
  "build==1.6.1",
  "twine==7.0.0",
  "pre-commit==4.7.0",
  "pyyaml==6.0.3",  # scripts/build_rules.py only; the same pin the guard-rules CI job uses
]

[tool.ruff]
target-version = "py311"
line-length = 110
# Python blocks in the docs are hand-aligned for reading; ruff would reformat them.
extend-exclude = [".venv", "runs", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  # `zip(..., strict=True)` raises where the code now silently stops at the shorter input. Adding it is a
  # behaviour change, so it is a per-call-site decision for a later PR, not a lint sweep.
  "B905",
]
# The formatter wraps code at 110; comments and string literals it cannot wrap get a little slack.
pycodestyle.max-line-length = 120
# These codes are not selected, but the `# noqa` comments that name them mark a deliberate choice (a broad
# `except`, an http.server `do_GET` method name) for the reader. Keep them rather than let RUF100 strip them.
external = ["BLE001", "N802"]

[tool.ruff.lint.per-file-ignores]
# Look-alike characters are the point: the normaliser folds them, and the tests feed them in.
"src/privacy_gate/guard/normalize.py" = ["RUF001", "RUF002", "RUF003"]
"tests/**" = ["RUF001", "RUF002", "RUF003"]
# The prompt is model input and every journal number was measured with it; re-wrapping it is not free.
"training/prompt.py" = ["E501"]
# User-facing copy in the Space UI, and Open WebUI reads the filter's front matter one line per key.
"demo/gradio/app.py" = ["E501"]
"integrations/open-webui/privacy_gate_filter.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["privacy_gate", "training"]

[tool.mypy]
python_version = "3.11"
# The training tools moved out of the wheel, not out of the type check.
files = ["src/privacy_gate", "training", "scripts"]
mypy_path = "src"
strict = true
warn_unreachable = true

# Not a relaxation of our code: `sentence-transformers` is the optional `local` extra, imported lazily inside
# LocalEmbedder._load, and it is not installed where mypy runs (CI installs no runtime dependencies at all).
[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

# The same for the comparison systems training/public_sets.py imports lazily, only when asked for.
[[tool.mypy.overrides]]
module = ["presidio_analyzer", "presidio_analyzer.*", "gliner", "gliner.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
# `training` is measured because most of it (calibrate, evaluate, embed, dataset, labels, prompt, features and
# the fitting half of head) was measured as part of `privacy_gate` before it moved out of the wheel. The five
# command-line measurements below came from scripts/, were never in the coverage source, and need a live
# endpoint or the llm-harness CLI; they are omitted so the number stays like for like. public_sets.py also came
# from scripts/, but it has unit tests, so it is counted.
source = ["privacy_gate", "training"]
omit = [
  "training/backends_agree.py",
  "training/latency.py",
  "training/lexical_baseline.py",
  "training/rules_oracle.py",
  "training/score_heldout.py",
]

[tool.coverage.report]
# 82 was set at 82.73 % (branch). The package split moved the training code to training/ (still measured) and
# added tests for training/chat.py and the training.head command: 84.52 % when the floor was raised to 84. The
# gap is the parts that need a live Ollama or a model: training/embed.py, ollama.py, and the CLI halves of
# training/calibrate.py and evaluate.py. Raise it as tests land; never lower it to make a red build green.
fail_under = 84
show_missing = true
skip_covered = true
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
