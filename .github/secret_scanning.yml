# Secret scanning: skip the evaluation data.
#
# This repository's whole subject is detecting credentials in text, so its
# evaluation set has to contain credential-shaped strings. Every one of them is
# invented, and SECURITY.md explains each. Two tripped the scanner on the first
# public push:
#
#   rgx-007  a JWT — the canonical jwt.io example header and payload with a
#            fabricated signature
#   rgx-008  an RSA private key block whose body is base64 of an English
#            sentence saying it is not a key
#
# Neither can be defanged without breaking the thing it tests. The PRIV003
# pattern this set is scored against needs two base64 segments to recognise a
# JWT, so a JWT fixture has to look like one. And a private-key fixture whose
# body plainly reads "not a real key" stops reading as a secret to the model
# too, which would make the label wrong rather than the fixture safe.
#
# Alerts here are therefore expected and are noise. Excluding the data files
# keeps the alert list meaningful, so a real finding in the *code* is not
# sitting among a dozen fixtures nobody reads any more.
#
# This is scoped as narrowly as possible: only the two labelled datasets, never
# src/, scripts/ or docs/.
paths-ignore:
  - "data/gold.jsonl"
  - "data/fresh.jsonl"
