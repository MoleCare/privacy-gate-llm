version: 2
updates:
  # Keeps pinned action SHAs current — without this, SHA pinning means staying
  # on a stale version forever.
  - package-ecosystem: "github-actions"
    directory: "/"  # .github/workflows and the composite action.yml at the root
    schedule:
      interval: "weekly"
    labels: ["dependencies", "github-actions"]

  # The Dockerfile's base images are pinned as `python:3.12-slim@sha256:...`; Dependabot proposes the next
  # digest of the same tag. Major Python versions are a deliberate change, not a bot PR.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "docker"]
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The package itself is standard library only (`dependencies = []`), so these are the exact pins around it:
  # the image's lock (docker/requirements.txt), the Gradio Space, and the `dev` group in pyproject.toml.
  # Grouped, so a week of bumps is one PR per directory instead of forty.
  - package-ecosystem: "pip"
    directories: ["/", "/docker", "/demo/gradio"]
    schedule:
      interval: "weekly"
    labels: ["dependencies", "python"]
    # torch comes from the CPU wheel index as 2.x.y+cpu. Dependabot reads that local version as an upgrade of
    # 2.x.y (it opened "bump torch from 2.15.0 to 2.15.0+cpu") and cannot resolve it in docker/. Bump torch by hand
    # in docker/requirements.in and .txt and demo/gradio/requirements.txt together; the pip-audit job checks that the
    # two pins agree and still reports torch advisories weekly.
    ignore:
      - dependency-name: "torch"
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  # js/ has no runtime dependencies; this keeps its one dev dependency (typescript) and the lock file current.
  - package-ecosystem: "npm"
    directory: "/js"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "javascript"]
