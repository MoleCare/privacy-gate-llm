name: PR checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # No install step and no dependencies on purpose: the package is standard
      # library only. If this ever needs a `pip install`, that is a design
      # change worth noticing in review.
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v

  lint-types-coverage:
    name: lint, types and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # Development tools only, from the exact pins in pyproject.toml's `dev` dependency group (pip 25.1+
      # reads `--group`), plus the package itself in editable mode, the way CONTRIBUTING.md sets up a clone.
      # The `tests` job above stays install-free, so the stdlib-only claim is still tested.
      - name: Install the package (editable) and the dev dependency group
        run: |
          python -m pip install -q pip==26.3
          python -m pip install -q -e . --group dev
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check --diff .
      - name: mypy (strict, src/privacy_gate, training and scripts)
        run: mypy
      # Branch coverage; the floor is `fail_under` in pyproject.toml.
      - name: Unit tests under coverage
        run: |
          coverage run -m unittest discover -s tests
          coverage report

  data:
    name: data integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The loader rejects unknown labels, repeated ids and missing fields. A
      # silently dropped row would change a denominator, and every number in
      # docs/JOURNAL.md is a ratio.
      - name: Datasets load and validate
        run: |
          PYTHONPATH=src python - <<'PY'
          from training.dataset import load
          for path, expected in (("data/gold.jsonl", 206), ("data/fresh.jsonl", 20), ("data/short-probe.jsonl", 21)):
              rows = load(path)
              assert len(rows) == expected, f"{path}: {len(rows)} rows, expected {expected}"
              print(f"{path}: {len(rows)} rows OK")
          PY

      - name: Head loads and has the documented shape
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          from privacy_gate.head import Model
          for path in ("model/head-v1.json", "model/head-v0.json"):
              raw = json.load(open(path))
              model = Model.from_json(json.dumps(raw))
              assert len(model.weights) == raw["dimensions"] == 1024, f"{path}: unexpected head width"
              assert len(model.mean) == len(model.stdev) == 1024
              print(f"{path} OK:", raw["dimensions"], "dims, AUC", raw["cross_validated_auc"])
          PY

      # The gold set describes credentials and patient data, so it is exactly the
      # kind of file where something real could be pasted by accident. These are
      # the markers of the invented fixtures we allow; anything else that looks
      # live should fail here rather than reach a public branch.
      - name: No live-looking credentials outside the known fixtures
        run: |
          if grep -rnE 'AKIA[0-9A-Z]{16}' --include='*.jsonl' --include='*.py' --include='*.md' . \
             | grep -v 'AKIAIOSFODNN7EXAMPLE'; then
            echo "::error::an AWS key that is not the AWS documentation placeholder"
            exit 1
          fi
          if grep -rnE 'sk-ant-api03-[A-Za-z0-9_-]{80,}' . ; then
            echo "::error::something the length of a real Anthropic key"
            exit 1
          fi
          echo "no live-looking credentials found"

  lexical-baseline:
    name: no-model baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # Needs no model, so CI can run it. It is also the gate against the gold
      # set quietly becoming trivial: if hashed unigrams ever score above 0.90,
      # the examples have started leaking their label through vocabulary and the
      # neural numbers stop meaning anything.
      - name: Lexical baseline stays in its expected band
        run: |
          PYTHONPATH=src python -m training.lexical_baseline --out /tmp/lexical.json
          PYTHONPATH=src python - <<'PY'
          import json
          auc = json.load(open("/tmp/lexical.json"))["auc"]
          print(f"lexical AUC {auc:.4f}")
          assert 0.60 <= auc <= 0.90, (
              f"lexical baseline {auc:.4f} outside 0.60-0.90. Above 0.90 means the "
              "gold set became separable by vocabulary alone; below 0.60 means it "
              "changed character. Either way the journal needs revisiting."
          )
          PY

  guard-rules:
    name: guard rules are compiled and every fixture passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # PyYAML is a development dependency of the generator only; the engine loads the compiled JSON. The
      # check rebuilds both generated files in memory and fails if they differ from the committed ones, if any
      # regex is not RE2-portable, or if any fixture produces other spans than its markers say.
      - name: Generated rules and conformance suite are up to date
        run: |
          pip install -q pyyaml==6.0.2
          PYTHONPATH=src python scripts/build_rules.py --check

  package:
    name: the wheel installs and carries the head
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # The only pip here builds and installs the package itself. The core has no dependencies, and this job
      # is where that is checked: the installed wheel must import, find its head and answer `info` with
      # nothing else installed.
      - name: Build
        run: pip install -q build && python -m build
      - name: Install the wheel in an empty environment and run it
        run: |
          python -m venv /tmp/clean && /tmp/clean/bin/pip install -q dist/*.whl
          /tmp/clean/bin/pip list --format=freeze | grep -v -i -E '^(pip|molecare.privacy.gate)=' && { echo "::error::the wheel pulled in a dependency"; exit 1; } || true
          /tmp/clean/bin/privacy-gate info
          /tmp/clean/bin/privacy-gate info | python -c "import json,sys,hashlib; i=json.load(sys.stdin); h=hashlib.sha256(open('model/head-v1.json','rb').read()).hexdigest(); assert i['head_sha256']==h, (i['head_sha256'], h); print('bundled head matches model/head-v1.json', h[:16])"
          /tmp/clean/bin/privacy-gate info | python -c "import json,sys,hashlib; i=json.load(sys.stdin); h=hashlib.sha256(open('src/privacy_gate/guard/privacy-v2.json','rb').read()).hexdigest(); assert i['ruleset']['sha256']==h, (i['ruleset'], h); print('bundled rules match privacy-v2.json', h[:16])"

  # The npm package in js/ (not a required check). It builds from the canonical head and rules, runs the
  # conformance suite the Python tests run, then a differential test: random texts through both engines must
  # give the same spans. Its version must match pyproject.toml, because one tag releases both.
  js:
    name: npm package (js/) builds and passes conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Version matches pyproject.toml
        run: |
          py="$(python -c "import tomllib; print(tomllib.load(open('../pyproject.toml','rb'))['project']['version'])")"
          js="$(node -p "require('./package.json').version")"
          [ "$py" = "$js" ] || { echo "::error file=js/package.json::version $js but pyproject.toml says $py"; exit 1; }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Python spans for the differential test
        run: PYTHONPATH=../src python scripts/differential.py > test/differential.json
      - run: npm test
      - name: The packed tarball holds only what is whitelisted, and imports with no dependencies
        run: |
          npm pack --silent
          tar -tzf privacy-gate-llm-*.tgz | sort
          if tar -tzf privacy-gate-llm-*.tgz | grep -v -E '^package/(dist/.*|head-v1\.json|privacy-v2\.json|LICENSE|NOTICE|README\.md|package\.json)$'; then
            echo "::error::the tarball holds a file outside the whitelist"; exit 1
          fi
          mkdir /tmp/consumer && cd /tmp/consumer && npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/js/privacy-gate-llm-*.tgz
          node --input-type=module -e "import { THRESHOLD, findSensitive } from 'privacy-gate-llm'; console.log(THRESHOLD, findSensitive('sk-ant-api03-QQ11ww22EE33rr44TT55yy66').length)"
          installed="$(find node_modules -mindepth 1 -maxdepth 1 ! -name '.*' | wc -l)"
          [ "$installed" -eq 1 ] || { echo "::error::the package pulled in a dependency"; ls node_modules; exit 1; }
